services:
  db:
    image: postgres:16-alpine
    container_name: ai_dashboard_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-ai_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DB_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_dashboard} -d ${POSTGRES_DB:-ai_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db_backup:
    image: postgres:16-alpine
    container_name: ai_dashboard_db_backup
    environment:
      TZ: ${TZ:-Europe/Madrid}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-ai_dashboard}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups/db
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    command: ["sh", "/usr/local/bin/backup-postgres.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
    container_name: ai_dashboard_api
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      APP_BASIC_USER: ${APP_BASIC_USER}
      APP_BASIC_PASSWORD: ${APP_BASIC_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ai_dashboard_web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8095}:80"
    restart: unless-stopped
