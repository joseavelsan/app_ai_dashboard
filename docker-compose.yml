services:
  db:
    image: postgres:16-alpine
    container_name: ai_dashboard_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-ai_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DB_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_dashboard} -d ${POSTGRES_DB:-ai_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: ai_dashboard_api
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      APP_BASIC_USER: ${APP_BASIC_USER}
      APP_BASIC_PASSWORD: ${APP_BASIC_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ai_dashboard_web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8095}:80"
    restart: unless-stopped
